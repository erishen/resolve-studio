# Real LLM + Web UI composition: OpenAI-compatible adapter behind the HTTP
# bridge. Credentials come from .env (OPENAI_API_KEY / OPENAI_BASE_URL /
# OPENAI_MODEL). Run the backend, then `cd web && npm run dev`.
#
# Filesystem sandbox roots. The `fs-roots` service is always loaded.
# Read is widened to the whole invest workspace so the Web file-picker can
# reach sibling projects; writes/shell stay pinned to this repo for safety.
# (Omit this block to fall back to cwd; read would then also add HARNESS_EXTRA_ROOTS.)
fs:
  readRoots:  [WORKSPACE]
  writeRoots: [WORKSPACE/agent-harness]
  shellRoots: [WORKSPACE/agent-harness]
plugins:
  - id: tools
    name: tools
  - id: agent
    name: agent
  - id: fastpath
    name: fastpath
  - id: approval
    name: approval
  - id: usage
    name: usage
  - id: skills
    name: skills
  - id: mcp
    name: mcp
    config:
      # MCP servers: 工具以 <id>:<tool> 注册进 ctx.tools，默认需审批（approval: false 可关）
      # servers:
      #   - id: fs
      #     transport: stdio
      #     command: npx
      #     args: ['-y', '@modelcontextprotocol/server-filesystem', '~erishen']
      #   - id: remote
      #     transport: http
      #     url: https://example.com/mcp
      servers: []
  - id: hello
    name: '@agent-harness/plugin-hello'
    config:
      interval: 15000
  - id: tool-hello
    name: tool-hello
  - id: llm
    name: llm-openai
    config:
      model: deepseek-chat
      temperature: 0.7
  - id: tool-echo
    name: tool-echo
  - id: tool-calculator
    name: tool-calculator
  - id: tool-read-file
    name: tool-read-file
  - id: tool-analyze-dir
    name: tool-analyze-dir
  - id: tool-analyze-code-dir
    name: tool-analyze-code-dir
  - id: tool-write-file
    name: tool-write-file
  - id: tool-shell
    name: tool-shell
  - id: tool-browser
    name: tool-browser
  - id: tool-pick-post
    name: tool-pick-post
  - id: tool-skill-run
    name: tool-skill-run
  - id: tool-portfolio-summary
    name: tool-portfolio-summary
  - id: tool-pse-review
    name: tool-pse-review
    config:
      # 重版周报用的模型：'agnes'(免费, 非流式) 或 'deepseek'(付费, 流式质量更高)
      # 也可用环境变量 PSE_REVIEW_PROVIDER=deepseek 覆盖
      provider: agnes
  - id: web
    name: web-server
    config:
      host: 127.0.0.1
      port: 8787
