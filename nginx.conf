server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # noVNC desktop (WebSocket bridge to backend:6080 inside the compose net)
    # ^~ 是关键：nginx 的正则 location（下方静态资源缓存规则）优先级高于普通
    # 前缀 location，css/js 等子资源会被正则截走去 root 下找 → 404。^~ 抑制
    # 正则匹配，让 /novnc/ 下所有请求（含 vnc.html 的 css/js/图片子资源）都进反代。
    location ^~ /novnc/ {
        proxy_pass http://backend:6080/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to the backend
    location /api/ {
        proxy_pass http://backend:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE support
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # Health check endpoint
    location = /health {
        proxy_pass http://backend:8787/health;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
