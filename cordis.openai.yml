# Real LLM composition: swap the mock adapter for an OpenAI-compatible one.
# Credentials come from .env (OPENAI_API_KEY / OPENAI_BASE_URL / OPENAI_MODEL)
# and may be overridden here.
#
# Filesystem sandbox roots (optional). The `fs-roots` service is always loaded;
# omit this block to default to cwd (read also adds HARNESS_EXTRA_ROOTS). Set it
# to pin the sandbox, e.g.:
# fs:
#   readRoots:  [WORKSPACE]
#   writeRoots: [WORKSPACE]
#   shellRoots: [WORKSPACE]
plugins:
  - id: tools
    name: tools
  - id: agent
    name: agent
  - id: fastpath
    name: fastpath
  - id: approval
    name: approval
  - id: usage
    name: usage
  - id: skills
    name: skills
  - id: mcp
    name: mcp
    config:
      # MCP servers: 工具以 <id>:<tool> 注册进 ctx.tools，默认需审批（approval: false 可关）
      # servers:
      #   - id: fs
      #     transport: stdio
      #     command: npx
      #     args: ['-y', '@modelcontextprotocol/server-filesystem', '~erishen']
      #   - id: remote
      #     transport: http
      #     url: https://example.com/mcp
      servers: []
  - id: hello
    name: '@agent-harness/plugin-hello'
    config:
      interval: 15000
  - id: tool-hello
    name: tool-hello
  - id: llm
    name: llm-openai
    config:
      model: deepseek-chat
      temperature: 0.7
  - id: tool-echo
    name: tool-echo
  - id: tool-calculator
    name: tool-calculator
  - id: tool-read-file
    name: tool-read-file
  - id: tool-analyze-dir
    name: tool-analyze-dir
  - id: tool-analyze-code-dir
    name: tool-analyze-code-dir
  - id: tool-write-file
    name: tool-write-file
  - id: tool-shell
    name: tool-shell
  - id: tool-browser
    name: tool-browser
  - id: tool-pick-post
    name: tool-pick-post
  - id: tool-skill-run
    name: tool-skill-run
  - id: tool-portfolio-summary
    name: tool-portfolio-summary
  - id: tool-pse-review
    name: tool-pse-review
  - id: cli
    name: cli-chat
