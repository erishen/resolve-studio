services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '8787:8787'
    environment:
      - NODE_ENV=production
      - PORT=8787
      - HOST=0.0.0.0
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-}
      - WORKSPACE_OUT=/app/workspace-analysis
    volumes:
      - ./workspace-analysis:/app/workspace-analysis
      - ./skills:/app/skills:ro
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:8787/health']
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    image: nginx:alpine
    ports:
      - '5173:80'
    volumes:
      - ./apps/web/dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    restart: unless-stopped
